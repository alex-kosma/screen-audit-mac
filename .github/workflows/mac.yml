# Installs Screen Audit on GitHub's macOS computers and checks it loads and
# talks to macOS. It can't click "Allow" on permissions, so screenshots and
# the menu bar icon still need a person on a real Mac.
name: macOS check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Install Codex (to check the options the app uses; not logged in)
        # A failed download shouldn't fail the run; the smoke test then says Codex wasn't checked.
        continue-on-error: true
        run: npm install -g @openai/codex
      - name: Unit tests
        run: python -m unittest discover tests -v
      - name: macOS smoke test
        run: python tests/mac_smoke.py
        env:
          SMOKE_SCREENSHOTS: ${{ runner.temp }}/screenshots
      - name: Open the app and take a picture of it
        run: python tests/mac_show.py "${{ runner.temp }}/screenshots"
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-${{ matrix.os }}
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore
          retention-days: 7
